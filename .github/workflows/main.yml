name: Build Wormphone APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners already ship the Android SDK, so no setup-android step.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Finds the project even if it was uploaded inside a subfolder.
      - name: Locate project
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -1)
          if [ -z "$f" ]; then echo "No settings.gradle.kts in the repo. Upload the unzipped files, not the zip."; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Wormphone-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          
